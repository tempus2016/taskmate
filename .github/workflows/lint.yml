name: Lint

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6 2026-06-17

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6 2026-06-17
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff==0.15.12"

      - name: Run ruff
        run: ruff check custom_components/taskmate tests
