version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    # Don't bump onto a release that's hours old — a freshly published action
    # version is the one most likely to be yanked or compromised.
    cooldown:
      default-days: 7

  # Dev tooling only (eslint) — nothing here ships in the integration.
  # Grouped so routine bumps arrive as one PR rather than one per package.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 7
    groups:
      npm-dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # The HA test harness in requirements_test.txt is deliberately pinned so a new
  # upstream release can't flip the required "Run tests" check on its own. This
  # entry doesn't undo that — it just raises one PR when a newer pin exists, so
  # the decision to move is explicit instead of never noticed. Limit 1 on
  # purpose: this should be a quiet trickle, not a queue.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 14
    ignore:
      # ci/constraints-floor.txt is a snapshot of a green floor-leg run, not a
      # dependency list to keep current: HA 2024.7.0 pins httpx==0.27.0 exactly,
      # so any bump makes the floor leg unresolvable (see closed PR #844).
      - dependency-name: "httpx"
