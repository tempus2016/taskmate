site_name: TaskMate
site_url: https://tempus2016.github.io/taskmate/
docs_dir: wiki
edit_uri: edit/main/wiki/
validation:
  anchors: warn
site_description: Chores, points and rewards for Home Assistant
repo_url: https://github.com/tempus2016/taskmate
repo_name: tempus2016/taskmate
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
  icon:
    logo: material/broom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
plugins:
  - search
