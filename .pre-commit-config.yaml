# Local pre-commit hooks — catch in a second what CI would otherwise catch in
# five minutes. Optional for contributors; CI remains the source of truth.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files      # one-off sweep
#
# pre-commit.ci (the GitHub App) runs the same hooks on PRs and pushes an
# autofix commit when a hook rewrites a file.

ci:
  autofix_commit_msg: "style: pre-commit.ci autofixes"
  autoupdate_commit_msg: "chore(deps): pre-commit autoupdate"
  autoupdate_schedule: monthly
  # Node isn't available in the pre-commit.ci runner, and the data checks need
  # the repo's own Python — both already run in GitHub Actions.
  skip: [eslint, translation-parity, data-files]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve the two-space markdown line break.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
        # Blueprints use HA's !input tag and mkdocs.yml a !!python tag for its
        # heading slugs; plain YAML can resolve neither.
        exclude: ^(blueprints/|mkdocs\.yml$)
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Keep this rev in step with RUFF_VERSION in .github/workflows/lint.yml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: ESLint (cards + panel)
        entry: npm run lint --silent
        language: system
        pass_filenames: false
        files: ^custom_components/taskmate/www/.*\.js$

      - id: translation-parity
        name: Every locale matches en.json
        entry: python3 scripts/check_translations.py
        language: system
        pass_filenames: false
        files: ^custom_components/taskmate/(translations|www/locales)/.*\.json$

      # Rewrites locales/<lang>/{cards,editor,panel}.json from locales/<lang>.json.
      # Stdlib-only, so pre-commit.ci runs it too and pushes the regenerated
      # bundles onto a translator's PR.
      - id: split-locales
        name: Regenerate the split locale bundles
        entry: python3 scripts/split_locales.py
        language: python
        pass_filenames: false
        files: ^(custom_components/taskmate/www/(locales/.*\.json|taskmate-localize\.js)|scripts/split_locales\.py)$

      - id: data-files
        name: Blueprints, sentences and metadata parse
        entry: python3 scripts/check_data_files.py
        language: system
        pass_filenames: false
        files: ^(blueprints/|custom_sentences/|hacs\.json|custom_components/taskmate/manifest\.json)
