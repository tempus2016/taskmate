[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["custom_components/taskmate/www"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled by formatter preference, not strict
    "E731",  # allow `_m = lambda ...` localisation helpers inside flow steps
]
