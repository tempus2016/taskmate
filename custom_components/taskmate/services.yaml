        text:

award_badge_manually:
  name: Award Badge Manually
  description: Manually award a badge to a child.
  fields:
    badge_id:
      name: Badge ID
      required: true
      selector:
        text:
    child_id:
      name: Child ID
      required: true
      selector:
        text:

revoke_badge:
  name: Revoke Badge
  description: Revoke an awarded badge. If a point bonus was credited, it is reversed.
  fields:
    awarded_badge_id:
      name: Awarded Badge ID
      required: true
      selector:
        text:

rebuild_badges:
  name: Rebuild Badges
  description: Re-evaluate all badges across all children silently (no notifications, no point bonuses).

# Wishlist (#932)
add_wish:
  name: Add Wish
  description: A child adds something they want to save for. It waits for a parent to approve it.
  fields:
    child_id:
      name: Child ID
      description: The ID of the child making the wish
      required: true
      selector:
        text:
    name:
      name: Name
      description: What the child wants
      required: true
      selector:
        text:
    target:
      name: Target
      description: Suggested number of points it costs. The parent can change it when approving.
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    link:
      name: Link
      description: Optional web address (http or https) for the thing
      required: false
      selector:
        text:
          type: url
    photo_url:
      name: Picture
      description: Optional picture just uploaded through the TaskMate photo endpoint
      required: false
      selector:
        text:

withdraw_wish:
  name: Withdraw Wish
  description: A child takes back a wish that is still waiting for approval, or clears one that was declined.
  fields:
    wish_id:
      name: Wish ID
      description: The ID of the wish
      required: true
      selector:
        text:
    child_id:
      name: Child ID
      description: The ID of the child whose wish it is
      required: true
      selector:
        text:

move_points_to_wish:
  name: Move Points to Wish
  description: Move points from a child's spendable balance into one of their approved wishes.
  fields:
    wish_id:
      name: Wish ID
      description: The ID of the wish
      required: true
      selector:
        text:
    child_id:
      name: Child ID
      description: The ID of the child whose wish it is
      required: true
      selector:
        text:
    points:
      name: Points
      description: How many points to move (capped at the balance and at what the wish still needs)
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box

take_points_from_wish:
  name: Take Points from Wish
  description: Give some of a child's own saved points back from a wish. Pledged points never come out.
  fields:
    wish_id:
      name: Wish ID
      description: The ID of the wish
      required: true
      selector:
        text:
    child_id:
      name: Child ID
      description: The ID of the child whose wish it is
      required: true
      selector:
        text:
    points:
      name: Points
      description: How many saved points to take back (capped at what the child saved)
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box

request_wish_redeem:
  name: Ask to Redeem Wish
  description: A fully funded wish becomes a reward claim waiting for the parent's approval.
  fields:
    wish_id:
      name: Wish ID
      description: The ID of the wish
      required: true
      selector:
        text:
    child_id:
      name: Child ID
      description: The ID of the child whose wish it is
      required: true
      selector:
        text:

approve_wish:
  name: Approve Wish
  description: Turn a waiting wish into a savings goal, optionally at a different target.
  fields:
    wish_id:
      name: Wish ID
      description: The ID of the wish
      required: true
      selector:
        text:
    target:
      name: Target
      description: Points the wish costs. Leave empty to keep the child's suggestion.
      required: false
      selector:
        number:
          min: 1
          max: 100000
          mode: box

decline_wish:
  name: Decline Wish
  description: Say no to a wish. Saved points go back to the child and pledges are voided.
  fields:
    wish_id:
      name: Wish ID
      description: The ID of the wish
      required: true
      selector:
        text:
    reason:
      name: Reason
      description: Optional reason shown to the child
      required: false
      selector:
        text:
          multiline: true

pledge_to_wish:
  name: Pledge to Wish
  description: Record points a relative chips in towards a child's wish. They never touch any balance.
  fields:
    wish_id:
      name: Wish ID
      description: The ID of the wish
      required: true
      selector:
        text:
    name:
      name: From
      description: Who the pledge is from, e.g. Grandma
      required: true
      selector:
        text:
    points:
      name: Points
      description: How many points to pledge (capped at what the wish still needs)
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    message:
      name: Message
      description: Optional message for the child
      required: false
      selector:
        text:

remove_wish_pledge:
  name: Remove Wish Pledge
  description: Undo a pledge. Allowed until the wish is redeemed.
  fields:
    wish_id:
      name: Wish ID
      description: The ID of the wish
      required: true
      selector:
        text:
    pledge_id:
      name: Pledge ID
      description: The ID of the pledge to remove
      required: true
      selector:
        text:

remove_wish:
  name: Remove Wish
  description: Delete a wish. Saved points go back to the child and pledges are voided.
  fields:
    wish_id:
      name: Wish ID
      description: The ID of the wish
      required: true
      selector:
        text:

start_inspection:
  name: Start Inspection
  description: >-
    Flag a chore approved in the last 24 hours for a surprise inspection. Pass or fail it before the window closes; an undecided inspection closes quietly.
  fields:
    completion_id:
      name: Completion ID
      description: The ID of the approved chore completion to inspect
      required: true
      selector:
        text:
    bonus:
      name: Bonus
      description: Points paid if it passes. Defaults to the Settings value.
      required: false
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    window:
      name: Window
      description: "How long you have to check it: 1h, 2h, 4h or bed (until bedtime). Defaults to the Settings value."
      required: false
      selector:
        select:
          options:
            - "1h"
            - "2h"
            - "4h"
            - "bed"
    tell_child:
      name: Tell the child
      description: Show "Inspection coming" on the child's card now. Turn off for a secret check.
      required: false
      selector:
        boolean:

pass_inspection:
  name: Pass Inspection
  description: The inspected chore passed. Pays the bonus as a normal points entry and celebrates on the child's card.
  fields:
    inspection_id:
      name: Inspection ID
      description: The ID of the open inspection
      required: true
      selector:
        text:
    bonus:
      name: Bonus
      description: Points to pay. Defaults to the bonus set when the inspection started.
      required: false
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    note:
      name: Note
      description: Optional note shown to the child
      required: false
      selector:
        text:

fail_inspection:
  name: Fail Inspection
  description: The inspected chore didn't pass. No points are taken. It can be sent back to redo; the redo earns nothing extra.
  fields:
    inspection_id:
      name: Inspection ID
      description: The ID of the open inspection
      required: true
      selector:
        text:
    redo:
      name: Send back to redo
      description: Put the chore back on the child's list as not done for today. Defaults to the Settings value.
      required: false
      selector:
        boolean:
    note:
      name: Note
      description: Optional note shown to the child (what needs fixing)
      required: false
      selector:
        text:

cancel_inspection:
  name: Cancel Inspection
  description: Call off an open inspection, as if it never started.
  fields:
    inspection_id:
      name: Inspection ID
      description: The ID of the open inspection
      required: true
      selector:
        text:

request_help:
  name: Ask for help
  description: A child says they are stuck on a chore. Sends the parents a push; nothing is completed or skipped.
  fields:
    child_id:
      name: Child ID
      description: The child asking for help
      required: true
      selector:
        text:
    chore_id:
      name: Chore ID
      description: The chore they are stuck on
      required: true
      selector:
        text:
    message:
      name: Message
      description: Optional words from the child, e.g. "I can't reach the shelf".
      required: false
      selector:
        text:

answer_help:
  name: Answer a help request
  description: Mark a child's help request as answered, so their card stops saying help is on its way.
  fields:
    request_id:
      name: Request ID
      description: The help request to close
      required: true
      selector:
        text:

log_mood:
  name: Log mood
  description: A child says how their day went. One per day; logging again replaces it.
  fields:
    child_id:
      name: Child ID
      description: The child
      required: true
      selector:
        text:
    mood:
      name: Mood
      description: great, good, ok, sad or upset
      required: true
      selector:
        select:
          options:
            - "great"
            - "good"
            - "ok"
            - "sad"
            - "upset"

set_sick_day:
  name: Set sick day
  description: Give a child a sick day. Their chores are hidden, their streak is frozen and no mandatory chore is missed.
  fields:
    child_id:
      name: Child ID
      description: The child who is unwell
      required: true
      selector:
        text:
    date:
      name: Date
      description: The day (default today). From a week ago to a month ahead.
      required: false
      selector:
        date:
    sick:
      name: Sick
      description: Turn off to take the sick day back.
      required: false
      default: true
      selector:
        boolean:

set_weekly_goal:
  name: Set weekly goal
  description: Set a child's own weekly points goal. Reaching it pays the family's weekly goal bonus once a week. 0 clears it.
  fields:
    child_id:
      name: Child ID
      description: The child
      required: true
      selector:
        text:
    target:
      name: Target
      description: Points to earn this week
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box

mark_reward_delivered:
  name: Mark reward delivered
  description: A redeemed reward has been handed over, so it leaves the owed list. Give child_id when the child is confirming their own.
  fields:
    claim_id:
      name: Claim ID
      description: The approved reward claim
      required: true
      selector:
        text:
    child_id:
      name: Child ID
      description: The child confirming they received it (leave empty when a parent marks it)
      required: false
      selector:
        text:

start_boost:
  name: Start a boost
  description: Open a boost window. Chores done inside it pay the multiplier. Leave chore_ids or child_ids empty for all of them.
  fields:
    multiplier:
      name: Multiplier
      description: What the covered chores pay, e.g. 2 for double (1.1 to 5)
      required: true
      selector:
        number:
          min: 1.1
          max: 5
          step: 0.1
          mode: box
    minutes:
      name: Minutes
      description: How long the boost lasts
      required: true
      selector:
        number:
          min: 1
          max: 1440
          mode: box
    chore_ids:
      name: Chore IDs
      description: The chores it covers (empty = all chores)
      required: false
      selector:
        object:
    child_ids:
      name: Child IDs
      description: The children it covers (empty = everyone)
      required: false
      selector:
        object:
    starts_at:
      name: Starts at
      description: Start later instead of now (up to a week ahead)
      required: false
      selector:
        datetime:
    name:
      name: Name
      description: Optional label shown on the cards, e.g. "Guests at six"
      required: false
      selector:
        text:
    notify:
      name: Notify
      description: Send the boost push to the children it covers (when that notification is switched on)
      required: false
      default: true
      selector:
        boolean:

end_boost:
  name: End a boost
  description: Stop a boost early, or call off one that hasn't started yet.
  fields:
    boost_id:
      name: Boost ID
      description: The boost, from the boosts attribute of sensor.taskmate_overview
      required: true
      selector:
        text:

adjust_screen_time:
  name: Adjust screen time
  description: Add minutes to a child's screen-time balance, or take some away with a negative number.
  fields:
    child_id:
      name: Child ID
      description: The child whose balance changes
      required: true
      selector:
        text:
    minutes:
      name: Minutes
      description: Minutes to add; negative to take away. The balance never goes below zero.
      required: true
      selector:
        number:
          min: -10080
          max: 10080
          mode: box
    reason:
      name: Reason
      description: A short note for the balance history
      required: false
      selector:
        text:

save_screen_time:
  name: Save screen time
  description: Move a child's unused screen-time minutes into their weekend jar. Today's allowance goes in first, then banked minutes, up to the jar's cap.
  fields:
    child_id:
      name: Child ID
      description: The child saving the minutes
      required: true
      selector:
        text:
    minutes:
      name: Minutes
      description: How many minutes to save. Leave empty to save everything that fits.
      required: false
      selector:
        number:
          min: 1
          max: 10080
          mode: box

appeal:
  name: Appeal
  description: A child asks for a second look at a rejected chore, a rejected reward claim or a penalty from the last 48 hours. Needs appeals switched on.
  fields:
    child_id:
      name: Child ID
      description: The child appealing
      required: true
      selector:
        text:
    kind:
      name: Kind
      description: What is being appealed
      required: true
      selector:
        select:
          options:
            - chore
            - reward
            - penalty
    target_id:
      name: Target ID
      description: The item, from the appealable attribute of the child's entry in sensor.taskmate_overview
      required: true
      selector:
        text:
    message:
      name: Message
      description: Optional words from the child, up to 200 characters
      required: false
      selector:
        text:

decide_appeal:
  name: Decide an appeal
  description: Overturn an appeal (pay the chore, approve the reward or undo the penalty) or uphold the original decision.
  fields:
    appeal_id:
      name: Appeal ID
      description: The appeal
      required: true
      selector:
        text:
    overturn:
      name: Overturn
      description: true to overturn, false to uphold
      required: true
      selector:
        boolean:
    note:
      name: Note
      description: Optional words for the child, up to 200 characters
      required: false
      selector:
        text:

buy_raffle_tickets:
  name: Buy raffle tickets
  description: A child spends points on tickets for a raffle. Each ticket is one chance in the draw.
  fields:
    raffle_id:
      name: Raffle ID
      description: The raffle
      required: true
      selector:
        text:
    child_id:
      name: Child ID
      description: The child buying
      required: true
      selector:
        text:
    tickets:
      name: Tickets
      description: How many tickets to buy
      required: true
      selector:
        number:
          min: 1
          max: 100
          mode: box

draw_raffle:
  name: Draw raffle
  description: Draw a raffle's winner now instead of waiting for its draw time.
  fields:
    raffle_id:
      name: Raffle ID
      description: The raffle to draw
      required: true
      selector:
        text:

adopt_pet:
  name: Adopt a pet
  description: A child adopts (or renames) their virtual pet. It grows with every chore they finish from now on.
  fields:
    child_id:
      name: Child ID
      description: The child
      required: true
      selector:
        text:
    species:
      name: Species
      description: dragon, cat, dog, bunny, dino or unicorn
      required: true
      selector:
        select:
          options:
            - "dragon"
            - "cat"
            - "dog"
            - "bunny"
            - "dino"
            - "unicorn"
    name:
      name: Name
      description: The pet's name
      required: true
      selector:
        text:
    hatch_egg:
      name: Hatch the egg
      description: Hatch the egg the grown-up pet laid into a new pet. The old pet joins the pet family.
      required: false
      default: false
      selector:
        boolean:

rate_reward:
  name: Rate a reward
  description: The child gives a reward they have had 1 to 3 stars. Once the reward is handed over (or approved, when fulfilment tracking is off), for 3 days.
  fields:
    child_id:
      name: Child ID
      description: The child who had the reward
      required: true
      selector:
        text:
    claim_id:
      name: Claim ID
      description: The reward claim being rated
      required: true
      selector:
        text:
    stars:
      name: Stars
      description: 1 to 3 stars
      required: true
      selector:
        number:
          min: 1
          max: 3
          mode: slider

sibling_check:
  name: Sibling check
  description: A child checks a sibling's chore that is waiting for approval. "done" approves it and pays the checker the sibling-check bonus; "not_yet" leaves it waiting for a parent, with a note. Needs sibling checks switched on, and the checker must be allowed to check that sibling.
  fields:
    child_id:
      name: Checker child ID
      description: The child doing the checking (not the one who did the chore)
      required: true
      selector:
        text:
    completion_id:
      name: Completion ID
      description: The waiting completion, from the sibling_checks attribute of the checker's entry in sensor.taskmate_overview
      required: true
      selector:
        text:
    verdict:
      name: Verdict
      description: done (looks done) or not_yet
      required: true
      selector:
        select:
          options:
            - done
            - not_yet
    note:
      name: Note
      description: Optional words for the parent with a "not yet", up to 120 characters
      required: false
      selector:
        text:

set_chore_reminder:
  name: Set chore reminder
  description: A child picks when to be reminded about one of their chores. The time must be inside the earliest/latest times set in TaskMate's settings. Leave the time empty to clear the reminder.
  fields:
    child_id:
      name: Child ID
      description: The child who wants reminding
      required: true
      selector:
        text:
    chore_id:
      name: Chore ID
      description: The chore to be reminded about
      required: true
      selector:
        text:
    time:
      name: Time
      description: HH:MM, e.g. 17:30. Empty clears the reminder.
      required: false
      selector:
        text:
