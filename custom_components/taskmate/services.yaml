    criteria:
      selector:
        object:
    combinator:
      selector:
        select:
          options:
            - AND
            - OR
    assigned_to:
      selector:
        object:
    enabled:
      selector:
        boolean:
    notify_on_earn:
      selector:
        boolean:

remove_badge:
  name: Remove Badge
  description: Remove a custom badge. Built-ins cannot be removed.
  fields:
    badge_id:
      name: Badge ID
