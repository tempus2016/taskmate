      description: "Photo of the finished job (required when the bounty asks for one)"
      required: false
      selector:
        text:

pause_timed_task:
  name: Pause Timed Task
  description: Pause a running timed task timer
  fields:
    chore_id:
      name: Chore ID
      description: The ID of the timed chore
      required: true
      selector:
        text:
    child_id:
      name: Child ID
      description: The ID of the child pausing the timer
      required: true
      selector:
        text:

stop_timed_task:
  name: Stop Timed Task
  description: Stop a timed task timer and submit for approval
  fields:
    chore_id:
      name: Chore ID
      description: The ID of the timed chore
      required: true
      selector:
        text:
    child_id:
      name: Child ID
      description: The ID of the child stopping the timer
      required: true
      selector:
        text:

add_badge:
  name: Add Badge
  description: Create a custom badge.
  fields:
    name:
      name: Name
      required: true
      example: "Holiday Helper"
      selector:
        text:
    description:
      name: Description
      example: "Earned for big effort during school holidays"
      selector:
        text:
    icon:
      name: Icon
      example: "mdi:beach"
      selector:
        icon:
    tier:
      name: Tier
      default: bronze
      selector:
        select:
          options:
            - bronze
            - silver
            - gold
            - platinum
    point_bonus:
      name: Point bonus
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          step: 1
          mode: box
    criteria:
      name: Criteria
      description: "List of metric / operator / value dicts (operator one of >=, ==, <=, >, <, !=). Empty = manual-award only."
      selector:
        object:
    combinator:
      name: Combinator
      description: "How multiple criteria combine: AND (all must pass) or OR (any). Default AND."
